name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'refactor/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.14.0'

jobs:
  # 🔍 Security & Dependency Scanning
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Configure Git
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📤 Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: 🛡️ Audit dependencies
        run: |
          pnpm audit --audit-level=high
          pnpm exec audit-ci --config ./audit-ci.json

  # 🧪 Quality & Testing
  test:
    name: 🧪 Test & Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Configure Git
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 TypeScript check
        run: pnpm typecheck

      - name: 🎨 Lint check
        run: pnpm lint

      - name: 💅 Format check
        run: pnpm format:check

      - name: 🧪 Run Unit & Core tests
        run: pnpm test:unit

      - name: 🔗 Run Integration tests
        run: pnpm test:integration

      - name: 🎨 Run Rendering tests
        run: pnpm test:rendering

      - name: 📊 Generate coverage report
        run: pnpm test:coverage

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: ✅ Coverage threshold check
        run: |
          # Enforce minimum coverage thresholds (75% statements/lines/functions, 70% branches)
          pnpm coverage:enforce

      - name: 📤 Upload unit test coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
          retention-days: 1

  # 🎭 E2E Setup (install browsers once with caching)
  e2e-setup:
    name: 🎭 E2E Setup
    runs-on: ubuntu-latest
    outputs:
      playwright-version: ${{ steps.get-playwright-version.outputs.version }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Configure Git
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Get Playwright version
        id: get-playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.get-playwright-version.outputs.version }}-v2

      - name: 🎭 Install Playwright browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          # Install browsers with all system dependencies (official recommended approach)
          # This includes Chromium, Firefox, and WebKit with their required dependencies
          pnpm exec playwright install --with-deps
        timeout-minutes: 15

      - name: 🏗️ Build application
        run: pnpm build

      - name: 💾 Cache build artifacts
        uses: actions/cache@v4
        with:
          path: dist/
          key: build-${{ github.sha }}

  # 🎭 E2E Testing (with descriptive feature-based shards)
  e2e:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: e2e-setup
    strategy:
      fail-fast: false
      matrix:
        project: 
          - '🎯 Core & Foundation'
          - '🧭 Navigation & Input'
          - '⏯️ Auto-play & State'
          - '♿ Accessibility & ARIA'
          - '🎨 Rendering & Performance'
          - '⚙️ Configuration & Errors'
          - '🦊 Firefox Cross-Browser'
          - '🧭 WebKit Desktop Safari'
          - '🌐 Edge Cross-Browser'
          - '📱 Mobile Chrome'
          - '📱 Mobile Safari'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Configure Git
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 💾 Restore Playwright browsers from cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ needs.e2e-setup.outputs.playwright-version }}-v2

      - name: 🎭 Verify Playwright installation (fallback)
        run: |
          # Quick check if browsers are available, install if missing
          if ! pnpm exec playwright install --dry-run >/dev/null 2>&1; then
            echo "⚠️ Browsers not found in cache, installing..."
            pnpm exec playwright install --with-deps
          else
            echo "✅ Browsers found in cache"
          fi
        timeout-minutes: 5

      - name: 💾 Restore build artifacts
        uses: actions/cache@v4
        with:
          path: dist/
          key: build-${{ github.sha }}

      - name: 🏗️ Build application (fallback)
        run: |
          if [ ! -d "dist" ]; then
            echo "⚠️ Build artifacts not found, building..."
            pnpm build
          else
            echo "✅ Build artifacts restored from cache"
          fi
        timeout-minutes: 5
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: 🎭 Run Playwright tests (${{ matrix.project }})
        run: pnpm playwright test --project="${{ matrix.project }}"
        env:
          CI: true
          COVERAGE: true
          NODE_OPTIONS: --max_old_space_size=4096
        timeout-minutes: 20

      - name: 🏷️ Create safe artifact name
        id: artifact-name
        run: |
          # Convert project name to safe artifact name with unique suffix
          PROJECT_CLEAN=$(echo "${{ matrix.project }}" | sed 's/[^a-zA-Z0-9 ]//g' | sed 's/  */-/g' | tr '[:upper:]' '[:lower:]' | sed 's/^-\|-$//g')
          SAFE_NAME="${PROJECT_CLEAN}-$(echo "${{ matrix.project }}" | sha1sum | cut -c1-8)"
          echo "name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: 📤 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}-${{ steps.artifact-name.outputs.name }}
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: 📊 Collect E2E coverage data
        run: pnpm exec tsx scripts/collect-e2e-coverage.ts

      - name: 📊 Upload E2E coverage data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-coverage-${{ github.run_id }}-${{ steps.artifact-name.outputs.name }}
          path: |
            coverage/.nyc_output/
            coverage/e2e-coverage.json
          retention-days: 1
          if-no-files-found: ignore

  # 📊 Merge Coverage Reports (runs after all E2E shards complete)
  coverage-merge:
    name: 📊 Merge Coverage Reports
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: always() && needs.test.result == 'success'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Configure Git
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📊 Download unit test coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-reports
          path: ./coverage/

      - name: 📊 Download all E2E coverage data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-coverage-*
          path: ./coverage/e2e-raw/
          merge-multiple: true

      - name: 🔀 Merge coverage reports
        run: |
          # Run our comprehensive coverage merge utility
          pnpm tsx scripts/coverage-utils.ts
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: 📊 Upload merged coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/merged/lcov.info
          flags: comprehensive
          name: comprehensive-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 📤 Upload merged coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage-reports
          path: |
            coverage/merged/
          retention-days: 30

  # 📊 Performance & Bundle Analysis
  performance:
    name: 📊 Performance Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Configure Git
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build for analysis
        run: pnpm build

      - name: 📦 Bundle size analysis
        run: |
          pnpm bundle:analyze
          # Check bundle size limits

      - name: 🔍 Lighthouse CI
        run: |
          npm install -g @lhci/cli serve
          npx serve -l 4173 dist &
          sleep 5
          lhci autorun --config=./lighthouserc.ts || echo "Lighthouse CI completed with warnings"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # ♿ Accessibility Testing
  accessibility:
    name: ♿ Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Configure Git
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build application
        run: pnpm build

      - name: ♿ Run accessibility tests
        run: |
          # Install axe-core CLI and browser-driver-manager for Chrome compatibility
          npm install -g @axe-core/cli browser-driver-manager
          # Install matching Chrome and ChromeDriver versions to prevent version mismatches
          npx browser-driver-manager install chrome
          # Test built application for WCAG 2.2 AA compliance
          axe --dir ./dist --tags wcag2a,wcag2aa,wcag21aa,wcag22aa

  # 🚀 Build & Deploy (on main branch only)
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [security, test, e2e-setup, e2e, coverage-merge, performance, accessibility]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Configure Git
        run: |
          git config --global init.defaultBranch main
          git config --global advice.detachedHead false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build
        run: pnpm build

      - name: 📤 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  # 📋 Quality Gate Summary
  quality-gate:
    name: 📋 Quality Gate
    runs-on: ubuntu-latest
    needs: [security, test, e2e-setup, e2e, coverage-merge, performance, accessibility]
    if: always()
    steps:
      - name: ✅ Check all jobs status
        run: |
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "❌ Security scan failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ Tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "❌ E2E tests failed"
            exit 1
          fi
          if [[ "${{ needs.performance.result }}" != "success" ]]; then
            echo "❌ Performance checks failed"
            exit 1
          fi
          if [[ "${{ needs.accessibility.result }}" != "success" ]]; then
            echo "❌ Accessibility tests failed"
            exit 1
          fi
          if [[ "${{ needs.coverage-merge.result }}" != "success" ]]; then
            echo "❌ Coverage merge failed"
            exit 1
          fi
          echo "✅ All quality gates passed!"
