name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'refactor/**']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.7.0'

jobs:
  # 🔍 Security & Dependency Scanning
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📤 Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: 🛡️ Audit dependencies
        run: |
          pnpm audit --audit-level=high
          pnpm exec audit-ci --config ./audit-ci.json

  # 🧪 Quality & Testing
  test:
    name: 🧪 Test & Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 TypeScript check
        run: pnpm typecheck

      - name: 🎨 Lint check
        run: pnpm lint

      - name: 💅 Format check
        run: pnpm format:check

      - name: 🧪 Run Unit & Core tests
        run: pnpm test:unit

      - name: 🔗 Run Integration tests
        run: pnpm test:integration

      - name: 🎨 Run Rendering tests
        run: pnpm test:rendering

      - name: 📊 Generate coverage report
        run: pnpm test:coverage

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: ✅ Coverage threshold check
        run: |
          # Enforce minimum coverage thresholds (75% statements/lines/functions, 70% branches)
          pnpm coverage:enforce

      - name: 📤 Upload unit test coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
          retention-days: 1

  # 🎭 E2E Setup (install browsers once with caching)
  e2e-setup:
    name: 🎭 E2E Setup
    runs-on: ubuntu-latest
    outputs:
      playwright-version: ${{ steps.get-playwright-version.outputs.version }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Get Playwright version
        id: get-playwright-version
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.get-playwright-version.outputs.version }}

      - name: 🎭 Install Playwright browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          # Install browsers with optimized settings
          pnpm exec playwright install --with-deps chromium firefox webkit
          # Pre-warm browser binaries
          pnpm exec playwright install-deps
        timeout-minutes: 15

      - name: 🔧 Install WebKit system dependencies
        run: |
          # Install missing WebKit dependencies for Ubuntu
          sudo apt-get update
          sudo apt-get install -y libwoff2-1.0-0 || true
          # Install additional WebKit dependencies if needed
          sudo apt-get install -y \
            libwebkit2gtk-4.0-37 \
            libenchant-2-2 \
            libsecret-1-0 \
            libhyphen0 \
            libgstreamer-plugins-base1.0-0 \
            libgstreamer-gl1.0-0 || true
        continue-on-error: true

      - name: 🏗️ Build application
        run: pnpm build

      - name: 💾 Cache build artifacts
        uses: actions/cache@v4
        with:
          path: dist/
          key: build-${{ github.sha }}

  # 🎭 E2E Testing (with sharding and cached browsers)
  e2e:
    name: 🎭 E2E Tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    needs: e2e-setup
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5, 6, 7, 8]
        shardTotal: [8]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 💾 Restore Playwright browsers from cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ needs.e2e-setup.outputs.playwright-version }}

      - name: 🎭 Verify Playwright installation (fallback)
        run: |
          # Quick check if browsers are available, install if missing
          if ! pnpm exec playwright install --dry-run >/dev/null 2>&1; then
            echo "⚠️ Browsers not found in cache, installing..."
            pnpm exec playwright install --with-deps chromium firefox webkit
          else
            echo "✅ Browsers found in cache"
          fi
        timeout-minutes: 5

      - name: 🔧 Ensure WebKit dependencies
        run: |
          # Install WebKit runtime dependencies (lightweight, always run)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwoff2-1.0-0 \
            libwebkit2gtk-4.0-37 \
            libenchant-2-2 || true
        continue-on-error: true

      - name: 💾 Restore build artifacts
        uses: actions/cache@v4
        with:
          path: dist/
          key: build-${{ github.sha }}

      - name: 🏗️ Build application (fallback)
        run: |
          if [ ! -d "dist" ]; then
            echo "⚠️ Build artifacts not found, building..."
            pnpm build
          else
            echo "✅ Build artifacts restored from cache"
          fi
        timeout-minutes: 5
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: 🎭 Run Playwright tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: pnpm playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          CI: true
          COVERAGE: true
          NODE_OPTIONS: --max_old_space_size=4096
        timeout-minutes: 20

      - name: 📤 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: playwright-report/
          retention-days: 30

      - name: 📊 Upload E2E coverage data
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-coverage-shard-${{ matrix.shardIndex }}
          path: |
            coverage/.nyc_output/
            coverage/e2e-coverage.json
          retention-days: 1

  # 📊 Merge Coverage Reports (runs after all E2E shards complete)
  coverage-merge:
    name: 📊 Merge Coverage Reports
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: always() && needs.test.result == 'success'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📊 Download unit test coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-reports
          path: ./coverage/

      - name: 📊 Download all E2E coverage data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-coverage-shard-*
          path: ./coverage/e2e-raw/
          merge-multiple: true

      - name: 🔀 Merge coverage reports
        run: |
          # Run our comprehensive coverage merge utility
          pnpm tsx scripts/coverage-utils.ts
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: 📊 Upload merged coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/merged/lcov.info
          flags: comprehensive
          name: comprehensive-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: 📤 Upload merged coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage-reports
          path: |
            coverage/merged/
          retention-days: 30

  # 📊 Performance & Bundle Analysis
  performance:
    name: 📊 Performance Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build for analysis
        run: pnpm build

      - name: 📦 Bundle size analysis
        run: |
          pnpm bundle:analyze
          # Check bundle size limits

      - name: 🔍 Lighthouse CI
        run: |
          npm install -g @lhci/cli serve
          npx serve -l 4173 dist &
          sleep 5
          lhci autorun --config=./lighthouserc.ts || echo "Lighthouse CI completed with warnings"
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # ♿ Accessibility Testing
  accessibility:
    name: ♿ Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build application
        run: pnpm build

      - name: ♿ Run accessibility tests
        run: |
          # Install axe-core CLI
          npm install -g @axe-core/cli
          # Test built application for WCAG 2.2 AA compliance
          axe --dir ./dist --tags wcag2a,wcag2aa,wcag21aa,wcag22aa

  # 🚀 Build & Deploy (on main branch only)
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [security, test, e2e-setup, e2e, coverage-merge, performance, accessibility]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build
        run: pnpm build

      - name: 📤 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  # 📋 Quality Gate Summary
  quality-gate:
    name: 📋 Quality Gate
    runs-on: ubuntu-latest
    needs: [security, test, e2e-setup, e2e, coverage-merge, performance, accessibility]
    if: always()
    steps:
      - name: ✅ Check all jobs status
        run: |
          if [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "❌ Security scan failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ Tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "❌ E2E tests failed"
            exit 1
          fi
          if [[ "${{ needs.performance.result }}" != "success" ]]; then
            echo "❌ Performance checks failed"
            exit 1
          fi
          if [[ "${{ needs.accessibility.result }}" != "success" ]]; then
            echo "❌ Accessibility tests failed"
            exit 1
          fi
          if [[ "${{ needs.coverage-merge.result }}" != "success" ]]; then
            echo "❌ Coverage merge failed"
            exit 1
          fi
          echo "✅ All quality gates passed!"
